<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avhan Akhada - Sanatan Wisdom Quotes</title>
  <style>
    :root {
      --primary-color: #d35400;
      --bg-color: #fdfefe;
      --card-bg: #ffffff;
      --text-color: #2c3e50;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      max-width: 600px;
      width: 100%;
      padding: 30px;
      text-align: center;
      border-top: 5px solid var(--primary-color);
    }

    h1 {
      color: var(--primary-color);
      margin-top: 0;
      font-size: 1.8rem;
    }

    .lang-select-container {
      margin-bottom: 20px;
    }

    select {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 1rem;
      outline: none;
      cursor: pointer;
    }

    .quote-box {
      margin: 30px 0;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .quote-text {
      font-size: 1.3rem;
      font-style: italic;
      line-height: 1.6;
      color: #34495e;
      margin-bottom: 15px;
    }

    .quote-category {
      font-weight: bold;
      color: var(--primary-color);
      font-size: 1rem;
    }

    button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #a04000;
    }

    button:disabled {
      background-color: #bdc3c7;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Sanatan Wisdom & Quotes</h1>

    <!-- Language Selector -->
    <div class="lang-select-container">
      <label for="language-select">Select Language: </label>
      <select id="language-select" onchange="changeLanguage()">
        <option value="en" selected>English</option>
        <option value="hi">हिन्दी (Hindi)</option>
        <option value="gu">ગુજરાતી (Gujarati)</option>
        <option value="bn">বাংলা (Bengali)</option>
      </select>
    </div>

    <!-- Quote Container -->
    <div class="quote-box">
      <div id="quote-text" class="quote-text">Loading quote...</div>
      <div id="quote-category" class="quote-category"></div>
    </div>

    <!-- Button -->
    <button id="new-quote-btn" onclick="getNewQuote()">Get New Quote</button>
  </div>

  <script>
    let quotesData = [];
    let lastIndex = -1;
    let currentLang = 'en';

    // Dynamic Translation Helper
    async function translateText(text, targetLang) {
      if (targetLang === 'en') return text;
      try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
        const res = await fetch(url);
        const data = await res.json();
        return data[0][0][0];
      } catch (e) {
        return text;
      }
    }

    // Load 500 Quotes from quotes.json
    async function loadQuotes() {
      try {
        const response = await fetch('quotes.json');
        quotesData = await response.json();
        getNewQuote();
      } catch (error) {
        document.getElementById('quote-text').innerText = '"Dharma protects those who protect it."';
        document.getElementById('quote-category').innerText = '— Category: Dharma';
      }
    }

    // Select a Random Quote from the 500 dataset
    async function getNewQuote() {
      if (!quotesData || quotesData.length === 0) return;

      const btn = document.getElementById('new-quote-btn');
      btn.disabled = true;

      let randomIndex;
      // Ensure the same quote does not repeat twice in a row
      do {
        randomIndex = Math.floor(Math.random() * quotesData.length);
      } while (quotesData.length > 1 && randomIndex === lastIndex);

      lastIndex = randomIndex;
      const selected = quotesData[randomIndex];

      // Translate and display in UI
      const transQuote = await translateText(selected.quote, currentLang);
      const transCategory = await translateText(selected.category, currentLang);

      document.getElementById('quote-text').innerText = `"${transQuote}"`;
      document.getElementById('quote-category').innerText = `— Category: ${transCategory}`;

      btn.disabled = false;
    }

    // Language Change Event
    async function changeLanguage() {
      currentLang = document.getElementById('language-select').value;
      if (lastIndex !== -1 && quotesData[lastIndex]) {
        const btn = document.getElementById('new-quote-btn');
        btn.disabled = true;
        const selected = quotesData[lastIndex];
        const transQuote = await translateText(selected.quote, currentLang);
        const transCategory = await translateText(selected.category, currentLang);

        document.getElementById('quote-text').innerText = `"${transQuote}"`;
        document.getElementById('quote-category').innerText = `— Category: ${transCategory}`;
        btn.disabled = false;
      }
    }

    // Initialize on Page Load
    document.addEventListener("DOMContentLoaded", () => {
      loadQuotes();
    });
  </script>

</body>
</html>

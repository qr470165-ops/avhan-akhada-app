<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avhan Akhada - Sanatan Wisdom</title>
  <style>
    :root {
      --primary-color: #d35400;
      --secondary-color: #e67e22;
      --accent-color: #f39c12;
      --bg-gradient: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 50%, #ffcc80 100%);
      --card-bg: #ffffff;
      --text-main: #2c3e50;
      --text-muted: #7f8c8d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Georgia', 'Times New Roman', serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(211, 84, 0, 0.2);
      max-width: 650px;
      width: 100%;
      padding: 40px 30px;
      text-align: center;
      border: 2px solid #ffe0b2;
      border-top: 6px solid var(--primary-color);
      position: relative;
    }

    .om-symbol {
      font-size: 2.2rem;
      color: var(--primary-color);
      margin-bottom: 5px;
    }

    h1 {
      color: var(--primary-color);
      margin: 0 0 20px 0;
      font-size: 2rem;
      letter-spacing: 0.5px;
    }

    .lang-select-container {
      margin-bottom: 25px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    select {
      padding: 10px 16px;
      border-radius: 8px;
      border: 2px solid var(--accent-color);
      background-color: #fff8e1;
      color: #b71c1c;
      font-size: 1rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    select:hover, select:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 8px rgba(211, 84, 0, 0.3);
    }

    .quote-box {
      margin: 25px 0 35px 0;
      padding: 25px;
      background: #fffcf5;
      border-left: 4px solid var(--accent-color);
      border-radius: 8px;
      min-height: 140px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }

    .quote-mark {
      font-size: 3rem;
      color: #ffe0b2;
      position: absolute;
      top: -10px;
      left: 15px;
      font-family: sans-serif;
      line-height: 1;
    }

    .quote-text {
      font-size: 1.35rem;
      font-style: italic;
      line-height: 1.6;
      color: #2c3e50;
      margin-bottom: 15px;
      z-index: 1;
    }

    .quote-category {
      font-weight: bold;
      color: var(--primary-color);
      font-size: 1.05rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    button {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: #ffffff;
      border: none;
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(211, 84, 0, 0.3);
      transition: all 0.3s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(211, 84, 0, 0.4);
    }

    button:disabled {
      background: #bdc3c7;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="om-symbol">ॐ</div>
    <h1>सनातन ज्ञान व सुविचार</h1>

    <!-- Language Selector: Exclusively Indian Languages + English -->
    <div class="lang-select-container">
      <label for="language-select">भाषा चुनें / Select Language: </label>
      <select id="language-select" onchange="changeLanguage()">
        <option value="en" selected>English</option>
        <option value="hi">हिन्दी (Hindi)</option>
        <option value="sa">संस्कृतम् (Sanskrit)</option>
        <option value="gu">ગુજરાતી (Gujarati)</option>
        <option value="bn">বাংলা (Bengali)</option>
        <option value="mr">मराठी (Marathi)</option>
        <option value="ta">தமிழ் (Tamil)</option>
        <option value="te">తెలుగు (Telugu)</option>
        <option value="kn">ಕನ್ನಡ (Kannada)</option>
        <option value="ml">മലയാളം (Malayalam)</option>
        <option value="pa">ਪੰਜਾਬੀ (Punjabi)</option>
        <option value="or">ଓଡ଼ିଆ (Odia)</option>
      </select>
    </div>

    <!-- Quote Box -->
    <div class="quote-box">
      <span class="quote-mark">“</span>
      <div id="quote-text" class="quote-text">Loading quote...</div>
      <div id="quote-category" class="quote-category"></div>
    </div>

    <!-- Button -->
    <button id="new-quote-btn" onclick="getNewQuote()">Get New Quote</button>
  </div>

  <script>
    let quotesData = [];
    let lastIndex = -1;
    let currentLang = 'en';

    // Dynamic Translation Helper
    async function translateText(text, targetLang) {
      if (targetLang === 'en') return text;
      try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
        const res = await fetch(url);
        const data = await res.json();
        return data[0][0][0];
      } catch (e) {
        return text;
      }
    }

    // Load 500 Quotes from quotes.json
    async function loadQuotes() {
      try {
        const response = await fetch('quotes.json');
        quotesData = await response.json();
        getNewQuote();
      } catch (error) {
        document.getElementById('quote-text').innerText = '"Dharma protects those who protect it."';
        document.getElementById('quote-category').innerText = '— Category: Dharma';
      }
    }

    // Select a Random Quote from dataset
    async function getNewQuote() {
      if (!quotesData || quotesData.length === 0) return;

      const btn = document.getElementById('new-quote-btn');
      btn.disabled = true;

      let randomIndex;
      do {
        randomIndex = Math.floor(Math.random() * quotesData.length);
      } while (quotesData.length > 1 && randomIndex === lastIndex);

      lastIndex = randomIndex;
      const selected = quotesData[randomIndex];

      const transQuote = await translateText(selected.quote, currentLang);
      const transCategory = await translateText(selected.category, currentLang);

      document.getElementById('quote-text').innerText = `"${transQuote}"`;
      document.getElementById('quote-category').innerText = `— Category: ${transCategory}`;

      btn.disabled = false;
    }

    // Language Change Event
    async function changeLanguage() {
      currentLang = document.getElementById('language-select').value;
      if (lastIndex !== -1 && quotesData[lastIndex]) {
        const btn = document.getElementById('new-quote-btn');
        btn.disabled = true;
        const selected = quotesData[lastIndex];
        const transQuote = await translateText(selected.quote, currentLang);
        const transCategory = await translateText(selected.category, currentLang);

        document.getElementById('quote-text').innerText = `"${transQuote}"`;
        document.getElementById('quote-category').innerText = `— Category: ${transCategory}`;
        btn.disabled = false;
      }
    }

    // Initialize on Page Load
    document.addEventListener("DOMContentLoaded", () => {
      loadQuotes();
    });
  </script>

</body>
</html>
